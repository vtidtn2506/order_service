server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: order-service
  profiles:
    active: ${ACTIVE_PROFILE:local}
  datasource:
    url: jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:6543/postgres?prepareThreshold=0
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # A message that can't be deserialized is handed to the error handler instead of failing forever
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.khoilnm.order_service.dto.event.StockDeductResultEvent


services:
  product:
    url: ${PRODUCT_SERVICE_URL:lb://product-service}
    connect-timeout: ${PRODUCT_SERVICE_CONNECT_TIMEOUT:3s}
    # Only used to read product prices (stock is deducted through Kafka)
    response-timeout: ${PRODUCT_SERVICE_RESPONSE_TIMEOUT:10s}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    # Register the IP instead of the machine hostname (the hostname may not resolve from other services)
    prefer-ip-address: true
